name: Cloudflare POC (local only)
on:
  push:
    branches: ['feat/cloudflare-migration']
    paths: ['cloudflare-poc/**', '.github/workflows/cloudflare-poc.yml', 'api/sync-stamps.js']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-poc-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  poc:
    if: github.ref == 'refs/heads/feat/cloudflare-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-poc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
      - run: node --test test/state.test.mjs
      - run: npm ci --no-audit --no-fund
      - run: node --test --test-concurrency=1 test/state.test.mjs test/node-adapter.test.mjs test/runtime.test.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: poc-lockfile
          path: cloudflare-poc/package-lock.json
          if-no-files-found: warn
          retention-days: 7
  storage:
    if: github.ref == 'refs/heads/feat/cloudflare-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
      - run: npm ci --omit=optional --no-audit --no-fund
        working-directory: api
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm ci --no-audit --no-fund
        working-directory: cloudflare-poc
      - run: bash test/profile-local.sh
        working-directory: cloudflare-poc
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: phase2-process-profile
          path: cloudflare-poc/reports/storage-process-profile.txt
          if-no-files-found: warn
          retention-days: 7
  auth-core:
    if: github.ref == 'refs/heads/feat/cloudflare-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
      - run: npm ci --no-audit --no-fund
        working-directory: cloudflare-poc
      - run: npm ci --omit=optional --no-audit --no-fund
        working-directory: api
      - run: google-chrome --version
      - run: node --check test/manual-passkey.mjs && node --check test/manual-passkey-ui.js && node --check test/auth-browser.test.mjs
        working-directory: cloudflare-poc
      - name: Auth local tests and profiling
        working-directory: cloudflare-poc
        run: |
          mkdir -p reports
          status=0
          /usr/bin/time -v -o reports/auth-process-profile.txt node --test --test-concurrency=1 test/auth-core.test.mjs test/auth-fault.test.mjs test/auth-differential.test.mjs test/auth-browser.test.mjs || status=$?
          cat reports/auth-process-profile.txt
          exit "$status"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: phase3-auth-process-profile
          path: cloudflare-poc/reports/auth-process-profile.txt
          if-no-files-found: warn
          retention-days: 7
  mobile-contract:
    if: github.ref == 'refs/heads/feat/cloudflare-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
      - run: npm ci --no-audit --no-fund
        working-directory: cloudflare-poc
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Pinned mobile modules against real local Worker
        working-directory: frontend
        run: |
          target=src/lib/phase4-cloudflare.integration.test.jsx
          test ! -e "$target"
          store=src/store/phase4-cloudflare.integration.test.jsx
          test ! -e "$store"
          cp ../cloudflare-poc/test/mobile-client.integration.test.jsx "$target"
          cp ../cloudflare-poc/test/mobile-store.integration.test.jsx "$store"
          trap 'rm -f "$target" "$store"' EXIT
          mkdir -p ../cloudflare-poc/reports
          status=0
          /usr/bin/time -v -o ../cloudflare-poc/reports/mobile-process-profile.txt node node_modules/vitest/vitest.mjs run "$target" "$store" --maxWorkers=1 || status=$?
          cat ../cloudflare-poc/reports/mobile-process-profile.txt
          exit "$status"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: phase4-mobile-process-profile
          path: cloudflare-poc/reports/mobile-process-profile.txt
          if-no-files-found: warn
          retention-days: 7
  upstream-api:
    if: github.ref == 'refs/heads/feat/cloudflare-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
      - run: npm ci --omit=optional --no-audit --no-fund
        working-directory: api
      - run: npm test
        working-directory: api
  frontend-and-assets:
    if: github.ref == 'refs/heads/feat/cloudflare-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node scripts/catalogue/stage-media.mjs frontend/dist
      - run: npm run assets
        working-directory: cloudflare-poc
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: poc-asset-manifest
          path: cloudflare-poc/reports/assets.json
          if-no-files-found: warn
          retention-days: 7

  web-media:
    if: github.ref == 'refs/heads/feat/cloudflare-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
      - run: npm ci --no-audit --no-fund
        working-directory: cloudflare-poc
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node scripts/catalogue/stage-media.mjs frontend/dist
      - name: Phase 5 local web and private R2 tests
        working-directory: cloudflare-poc
        run: |
          mkdir -p reports
          node --check src/media.js
          node --check src/web-worker.js
          status=0
          /usr/bin/time -v -o reports/web-media-process-profile.txt node --test --test-concurrency=1 test/web-media.test.mjs || status=$?
          cat reports/web-media-process-profile.txt
          exit "$status"
      - name: Actual upstream frontend media sync against local R2
        working-directory: frontend
        run: |
          target=src/lib/phase5-cloudflare-media.integration.test.jsx
          test ! -e "$target"
          cp ../cloudflare-poc/test/media-client.integration.test.jsx "$target"
          trap 'rm -f "$target"' EXIT
          status=0
          /usr/bin/time -v -o ../cloudflare-poc/reports/media-client-process-profile.txt node node_modules/vitest/vitest.mjs run "$target" --maxWorkers=1 || status=$?
          cat ../cloudflare-poc/reports/media-client-process-profile.txt
          exit "$status"
      - run: google-chrome --version
      - name: Mounted browser SPA private media gallery
        working-directory: cloudflare-poc
        run: |
          status=0
          /usr/bin/time -v -o reports/web-browser-process-profile.txt node --test --test-concurrency=1 test/web-browser.test.mjs || status=$?
          cat reports/web-browser-process-profile.txt
          exit "$status"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: phase5-web-media-process-profile
          path: |
            cloudflare-poc/reports/web-media-process-profile.txt
            cloudflare-poc/reports/media-client-process-profile.txt
            cloudflare-poc/reports/web-browser-process-profile.txt
          if-no-files-found: warn
          retention-days: 7

  privacy-recovery:
    if: github.ref == 'refs/heads/feat/cloudflare-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
      - run: npm ci --no-audit --no-fund
        working-directory: cloudflare-poc
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node scripts/catalogue/stage-media.mjs frontend/dist
      - name: Phase 6 local synthetic recovery archive and quota ledger
        working-directory: cloudflare-poc
        run: |
          mkdir -p reports
          node --check src/recovery/archive.js && node --check src/recovery/disk.js && node --check src/recovery/bundle.js
          status=0
          /usr/bin/time -v -o reports/privacy-recovery-process-profile.txt node --test --test-concurrency=1 test/privacy-recovery.test.mjs test/recovery-worker.test.mjs test/recovery-bundle.test.mjs || status=$?
          cat reports/privacy-recovery-process-profile.txt
          exit "$status"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: phase6-privacy-recovery-process-profile
          path: cloudflare-poc/reports/privacy-recovery-process-profile.txt
          if-no-files-found: error
          retention-days: 7
