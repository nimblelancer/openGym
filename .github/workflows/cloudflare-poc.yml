name: Cloudflare POC (local only)
on:
  push:
    branches: ['feat/cloudflare-migration']
    paths: ['cloudflare-poc/**', '.github/workflows/cloudflare-poc.yml', 'api/sync-stamps.js']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-poc-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  poc:
    if: github.ref == 'refs/heads/feat/cloudflare-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-poc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
      - run: node --test test/state.test.mjs
      - run: npm ci --no-audit --no-fund
      - run: node --test --test-concurrency=1 test/state.test.mjs test/node-adapter.test.mjs test/runtime.test.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: poc-lockfile
          path: cloudflare-poc/package-lock.json
          if-no-files-found: warn
          retention-days: 7
  storage:
    if: github.ref == 'refs/heads/feat/cloudflare-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
      - run: npm ci --omit=optional --no-audit --no-fund
        working-directory: api
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm ci --no-audit --no-fund
        working-directory: cloudflare-poc
      - run: bash test/profile-local.sh
        working-directory: cloudflare-poc
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: phase2-process-profile
          path: cloudflare-poc/reports/storage-process-profile.txt
          if-no-files-found: warn
          retention-days: 7
  auth-core:
    if: github.ref == 'refs/heads/feat/cloudflare-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
      - run: npm ci --no-audit --no-fund
        working-directory: cloudflare-poc
      - run: npm ci --omit=optional --no-audit --no-fund
        working-directory: api
      - run: google-chrome --version
      - name: Auth local tests and profiling
        working-directory: cloudflare-poc
        run: |
          mkdir -p reports
          status=0
          /usr/bin/time -v -o reports/auth-process-profile.txt node --test --test-concurrency=1 test/auth-core.test.mjs test/auth-fault.test.mjs test/auth-differential.test.mjs test/auth-browser.test.mjs || status=$?
          cat reports/auth-process-profile.txt
          exit "$status"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: phase3-auth-process-profile
          path: cloudflare-poc/reports/auth-process-profile.txt
          if-no-files-found: warn
          retention-days: 7
  upstream-api:
    if: github.ref == 'refs/heads/feat/cloudflare-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
      - run: npm ci --omit=optional --no-audit --no-fund
        working-directory: api
      - run: npm test
        working-directory: api
  frontend-and-assets:
    if: github.ref == 'refs/heads/feat/cloudflare-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node scripts/catalogue/stage-media.mjs frontend/dist
      - run: npm run assets
        working-directory: cloudflare-poc
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: poc-asset-manifest
          path: cloudflare-poc/reports/assets.json
          if-no-files-found: warn
          retention-days: 7
