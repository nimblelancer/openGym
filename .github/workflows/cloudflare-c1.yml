name: Phase 7 C1 feasibility (local only)
on:
  push:
    branches: ['feat/cloudflare-migration']
    paths: ['cloudflare-poc/test/c1/**', '.github/workflows/cloudflare-c1.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  c1-feasibility:
    if: github.ref == 'refs/heads/feat/cloudflare-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare-poc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
      - run: npm ci --no-audit --no-fund
      - name: C1 source-only qualification and process profile
        run: |
          mkdir -p reports/c1
          set -o pipefail
          /usr/bin/time -v -o reports/c1/process.txt node --test --test-reporter=tap --test-concurrency=1 test/c1/*.test.mjs | tee reports/c1/tests.tap
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: phase7-c1-feasibility
          path: cloudflare-poc/reports/c1/
          if-no-files-found: error
          retention-days: 7
